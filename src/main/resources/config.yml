# AICompanions Configuration
# AI-powered NPCs with personalities, factions, quests, and dynamic conversations

# =============================================================================
# AI Provider Settings
# =============================================================================
ai:
  # Primary provider: "claude" or "openai"
  provider: "claude"

  # Claude API Settings
  claude:
    api-key: "YOUR_CLAUDE_API_KEY_HERE"
    model: "claude-sonnet-4-20250514"
    max-tokens: 300

  # OpenAI API Settings
  openai:
    api-key: "YOUR_OPENAI_API_KEY_HERE"
    model: "gpt-4o"
    max-tokens: 300

  # Request settings
  timeout-seconds: 30
  retry-attempts: 3

  # Rate limiting (requests per minute per player)
  rate-limit: 10

# =============================================================================
# NPC Settings
# =============================================================================
npcs:
  # How far players can interact with NPCs (blocks)
  interaction-distance: 5

  # Enable wandering behavior
  wandering:
    enabled: true
    # How often NPCs decide to move (ticks, 20 = 1 second)
    decision-interval: 200
    # Maximum wander distance from spawn point
    max-distance: 50
    # Chance to wander vs stay still (0.0 - 1.0)
    wander-chance: 0.3

  # NPC vulnerability settings
  vulnerability:
    # Can NPCs take damage from mobs?
    damage-from-mobs: true
    # Can NPCs take damage from other NPCs?
    damage-from-npcs: true
    # Can NPCs take damage from players?
    damage-from-players: false
    # Do NPCs respawn after death?
    respawn: true
    # Respawn delay in seconds
    respawn-delay: 300

  # Combat settings for hostile NPCs
  combat:
    enabled: true
    # How far NPCs detect threats
    detection-range: 16
    # Attack cooldown in ticks
    attack-cooldown: 20

  # NPC social interactions
  social:
    enabled: true

  # NPC home building
  building:
    enabled: true

  # NPC television system
  television:
    # Enable TVs in NPC homes
    enabled: true
    # How often to update TV content (ticks, 100 = 5 seconds)
    tick-rate: 100
    # How close players must be to see TV content (blocks)
    view-distance: 8.0

# =============================================================================
# Faction Settings
# =============================================================================
factions:
  # Default factions created on first run
  defaults:
    - name: "Villagers"
      color: "GREEN"
      description: "Peaceful traders and farmers"
      hostile-to: []

    - name: "Bandits"
      color: "RED"
      description: "Ruthless outlaws who prey on travelers"
      hostile-to: ["Villagers", "Guards", "Merchants"]

    - name: "Guards"
      color: "BLUE"
      description: "Protectors of the realm"
      hostile-to: ["Bandits", "Cultists"]

    - name: "Merchants"
      color: "GOLD"
      description: "Wandering traders seeking profit"
      hostile-to: []

    - name: "Wanderers"
      color: "GRAY"
      description: "Mysterious travelers with unknown motives"
      hostile-to: []

    - name: "Cultists"
      color: "DARK_PURPLE"
      description: "Mysterious followers of Geodjian who dwell in dark places"
      hostile-to: ["Guards"]

# =============================================================================
# Memory & Conversation Settings
# =============================================================================
memory:
  # How many messages to remember per NPC-player pair
  max-history: 20

  # How long to keep memories (days, 0 = forever)
  retention-days: 30

  # Enable NPCs sharing information about players
  gossip-enabled: true

  # How often NPCs gossip (minutes)
  gossip-interval: 30

# =============================================================================
# Quest Settings
# =============================================================================
quests:
  # Enable AI-generated quests
  ai-generated: true

  # Quest types that can be generated
  types:
    - "fetch"      # Bring items to NPC
    - "kill"       # Defeat enemies
    - "build"      # Construct structures in an area
    - "explore"    # Discover locations
    - "delivery"   # Deliver items to another NPC

  # Quest area detection radii (blocks)
  # Build quests: how close blocks must be to quest center
  build-radius: 25
  # Explore quests: how close player must be to complete
  explore-radius: 15

  # Reward multipliers
  rewards:
    experience-multiplier: 1.0
    item-multiplier: 1.0

# =============================================================================
# Auto-Spawning Settings (Sporadic Mode)
# =============================================================================
spawning:
  # Enable automatic NPC spawning
  enabled: true

  # How many NPCs can exist per world (total)
  max-npcs-per-world: 50

  # How many NPCs should be near each player (within render distance)
  # Lower values = more sparse, natural feel
  npcs-per-area: 8

  # Spawn interval range (random between min and max for sporadic feel)
  min-interval-seconds: 45
  max-interval-seconds: 180

  # Batch size range (random NPCs per spawn cycle)
  min-batch-size: 1
  max-batch-size: 3

  # Chance to actually spawn when interval triggers (percent)
  # Lower = more sporadic, less predictable
  spawn-chance-percent: 60

  # Minimum distance from player to spawn
  min-distance-from-player: 20

  # Maximum distance from player to spawn
  max-distance-from-player: 80

  # Initial spawn on server start (random 0 to this number)
  initial-spawn-count: 3

  # Distant travelers - NPCs that spawn far away and wander through
  travelers:
    enabled: true
    # Chance per spawn cycle to spawn a distant traveler (percent)
    chance-percent: 25

# =============================================================================
# World Settings
# =============================================================================
world:
  # Worlds where NPCs can spawn
  enabled-worlds:
    - "world"
    - "world_nether"
    - "world_the_end"

  # Spawn NPCs near villages
  spawn-near-villages: true

# =============================================================================
# Performance Settings
# =============================================================================
performance:
  # Use async processing for AI calls
  async-ai-calls: true

  # Database auto-save interval (minutes)
  save-interval: 5

  # Enable debug logging
  debug: false
