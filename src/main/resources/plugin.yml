name: AICompanions
version: ${project.version}
main: com.aicraft.AICompanions
api-version: '1.20'
description: AI-powered NPCs with personalities, factions, quests, and dynamic conversations
author: YourName
website: https://github.com/yourusername/AICompanions

commands:
  npc:
    description: Manage AI NPCs
    usage: /<command> <create|remove|list|info|teleport>
    permission: aicompanions.npc
  faction:
    description: Manage factions
    usage: /<command> <create|remove|list|info|setrelation>
    permission: aicompanions.faction
  quest:
    description: Quest journal - Opens GUI, track quests with waypoints
    usage: /<command> [list|info|track|waypoint|abandon]
    permission: aicompanions.quest
    aliases: [quests, questlog, journal]
  aiconfig:
    description: Configure AI settings
    usage: /<command> <reload|setprovider|test>
    permission: aicompanions.admin
  minimap:
    description: Get and manage your minimap
    usage: /<command> [give|toggle|waypoint]
    permission: aicompanions.minimap
    aliases: [map]

permissions:
  aicompanions.npc:
    description: Allows NPC management
    default: op
  aicompanions.faction:
    description: Allows faction management
    default: op
  aicompanions.quest:
    description: Allows quest management and viewing quest journal
    default: true
  aicompanions.admin:
    description: Full admin access
    default: op
  aicompanions.talk:
    description: Allows talking to NPCs
    default: true
  aicompanions.minimap:
    description: Allows using the minimap
    default: true
